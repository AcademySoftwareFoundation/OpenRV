# URL of the team marketplace git repo.
# The marketplace name (last path component, .git stripped) determines the state file:
#   ~/.local/state/<marketplace-name>/state.json
marketplace_url: https://git.autodesk.com/shotgun/fpt-marketplace.git

# Git URL of the onboard plugin (used by Cursor bootstrap when Claude CLI is absent).
onboard_plugin_repo: https://git.autodesk.com/shotgun/onboard-skill.git

# Agent config directories to wire up as symlinks to .agents/.
agent_dirs: [.claude, .cursor]

# Scope for Claude Code plugin installation: user (global) or project (repo-scoped).
plugin_install_scope: user

# How long (in hours) to cache the update check result for shell prompt integrations.
check_interval_hours: 4

# Optional custom onboarding steps run by onboard-repo at the end of /onboard.
# Used when no .agents/skills/onboard-repo/SKILL.md exists in this repo.
#custom_onboarding: |
#  ## Dev environment setup
#  1. Run your dependency install command
#  2. Copy `.env.example` to `.env` and fill in credentials

# Custom instructions injected into the onboard-plugins wizard before any steps run.
#custom_instructions: |
#  my-plugin: document any post-install steps for marketplace plugins here
